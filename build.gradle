plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Force org.lwjgl to Maven Central. Minecraft only mirrors its pinned LWJGL
	// version on libraries.minecraft.net, so the version forced in gradle.properties
	// (and its extra variants like the "unsafe" jar Minecraft needs) cannot resolve
	// there; Central hosts the full LWJGL 3.4.x artifact set. The repo name matches
	// Fabric Loom's own pin (see forceLWJGLFromMavenCentral) so Loom won't add a second one.
	exclusiveContent {
		forRepository {
			maven {
				name = 'MavenCentralLWJGL'
				url = 'https://repo.maven.apache.org/maven2/'
			}
		}
		filter {
			includeGroup('org.lwjgl')
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"lamplight" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Force LWJGL past Minecraft's pinned version (see gradle.properties).
	// Must run before the minecraft dependency resolves its libraries.
	configurations.configureEach {
		resolutionStrategy.eachDependency { details ->
			if (details.requested.group == 'org.lwjgl' && details.requested.name.startsWith('lwjgl')) {
				details.useVersion(project.lwjgl_version)
				details.because('openal-soft 1.25.1 segfaults on exit on linux-arm64 (kcat/openal-soft#1248)')
			}
		}
	}

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform("org.junit:junit-bom:5.13.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
	systemProperty "lamplight.root", rootDir.absolutePath
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
